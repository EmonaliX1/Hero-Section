<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero-section3</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background"></div>
    <nav>
        <div class="logo">
            <div class="icon">
                <i class="fa-solid fa-caret-up"></i>
            </div>
            <div class="tittle">Payway</div>
        </div>
        
        <ul class="links">
            <li>Online Paymant
                <div class="icon">
                    <i class="fa-solid fa-angle-down"></i>
                </div>
            </li>
            <li>Product
                <div class="icon">
                    <i class="fa-solid fa-angle-down"></i>
                </div>
            </li>
            <li>Company</li>
            <li>Resource
                <div class="icon">
                    <i class="fa-solid fa-angle-down"></i>
                </div>
            </li>
            <li>Contact Us</li>
        </ul>

        <div class="active_btn">
            <a href="#">Login</a>
        </div>
    </nav>

    <section>
        <div class="paymant">
           <h1>Paymant</h1>
           <div class="ToggleBtn">
            <div class="rounded">
                <div class="circle"></div>
            </div>
           </div>
        </div>
        <div class="that_feel">
            <!-- <div class="mobile_Casing">
                <div class="card card1">
                    <h3>pay</h3>
                    <span>original oods</span>
                </div>
            </div> -->
            <h1>that feel</h1>
        </div>
        <div class="effort_less">
            <h1>effort less</h1>
            <div class="cards">
                <div class="card card1">
                    <i class="fa-solid fa-bolt-lightning"></i>
                </div>
                <div class="card card2">
                   <i class="fa-solid fa-fingerprint"></i>
                </div>
                <div class="card card3">
                  <i class="fa-solid fa-unlock-keyhole"></i>
                </div>
            </div>
        </div>
        <p>Design for modern payment experience that feels <br>
            seamless from the first to the final confirmation 
        </p>
        <div class="getStared_btn">
            <a href="#">Get Stared 
                <div class="icon">
                <i class="fa-solid fa-caret-up"></i>
                </div>
            </a>
        </div>
    </section>






    <script src="script.js"></script>
</body>
</html>
